[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediarenamer"
version = "0.1.0"
description = "Evidence-based media file renamer: matches TV episodes and movies against online databases with explainable decisions"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
mediarenamer = "mediarenamer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
