[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediarenamer"
version = "0.1.1"
description = "Evidence-based media file renamer: matches TV episodes and movies against online databases with explainable decisions"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
mediarenamer = "mediarenamer.cli:main"

[project.gui-scripts]
mediarenamer-gui = "mediarenamer.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
